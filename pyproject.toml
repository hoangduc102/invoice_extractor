[project]
name = "invoice-extractor"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "frontend", "*.md"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import sorting, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]  # long prompt strings / HTML; formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
