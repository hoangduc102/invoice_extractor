name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check . --output-format=github
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest -q

  api-postgres:
    name: API against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoice" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://invoice:invoice@localhost:5432/invoices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Start API and hit it
        run: |
          uvicorn api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf "localhost:8000/invoices?limit=5"
          curl -sf localhost:8000/invoices/stats
          # Ollama is not available in CI: extraction must fail cleanly with 502 and save nothing.
          code=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@example_docs/hourly_invoice_template.png" localhost:8000/invoices/extract)
          test "$code" = "502"
          curl -sf "localhost:8000/invoices" | grep -q '"total":0'

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
